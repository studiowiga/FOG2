name: Build Fog Z VST3 (Windows + macOS)
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FogZ-VST3-Windows
          # wildcard: works whatever the CMake target is called
          path: build/*_artefacts/Release/VST3/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G Xcode
      - name: Build (universal arm64 + x86_64)
        run: cmake --build build --config Release --parallel -- -quiet
      - name: Find, sign and package the plug-in
        shell: bash
        run: |
          set -e
          VST="$(find build -type d -name '*.vst3' -path '*Release/VST3/*' | head -n 1)"
          if [ -z "$VST" ]; then echo "No .vst3 found"; find build -name '*.vst3'; exit 1; fi
          echo "Found: $VST"
          mkdir -p dist
          cp -R "$VST" dist/
          NAME="$(basename "$VST")"
          codesign --force --deep --sign - "dist/$NAME"
          lipo -info "dist/$NAME/Contents/MacOS/"* || true
          cat > "dist/INSTALL macOS.txt" <<TXT
          1. Copy "$NAME" to  ~/Library/Audio/Plug-Ins/VST3/   (or /Library/Audio/Plug-Ins/VST3/)
          2. Open Terminal and run once:
                xattr -cr ~/Library/Audio/Plug-Ins/VST3/"$NAME"
             (removes the "downloaded from the internet" quarantine flag)
          3. Re-scan plug-ins in Reaper (Options > Preferences > Plug-ins > VST > Re-scan).
          TXT
          ls -la dist
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FogZ-VST3-macOS
          path: dist/
