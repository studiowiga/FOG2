name: Build Fog Z VST3 (Windows + macOS)
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FogZ-VST3-Windows
          path: build/FogZ_artefacts/Release/VST3/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -G Xcode
      - name: Build (universal arm64 + x86_64)
        run: cmake --build build --config Release --parallel -- -quiet
      - name: Ad-hoc sign + README
        run: |
          cd build/FogZ_artefacts/Release/VST3
          codesign --force --deep --sign - "Fog Z.vst3"
          lipo -info "Fog Z.vst3/Contents/MacOS/Fog Z"
          cat > "INSTALL macOS.txt" <<'TXT'
          1. Copy Fog Z.vst3 to  ~/Library/Audio/Plug-Ins/VST3/   (or /Library/Audio/Plug-Ins/VST3/)
          2. Open Terminal and run once:
                xattr -cr ~/Library/Audio/Plug-Ins/VST3/"Fog Z.vst3"
             (removes the "downloaded from the internet" quarantine flag)
          3. Re-scan plug-ins in Reaper (Options > Preferences > Plug-ins > VST > Re-scan).
          TXT
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: FogZ-VST3-macOS
          path: |
            build/FogZ_artefacts/Release/VST3/Fog Z.vst3
            build/FogZ_artefacts/Release/VST3/INSTALL macOS.txt
